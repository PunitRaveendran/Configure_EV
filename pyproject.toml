[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "charger-truth"
version = "0.1.0"
description = "Belief-based EV charger connector health estimation and routing"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Punit Raveendran" }]
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "websockets>=11.0",
    "scipy>=1.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
